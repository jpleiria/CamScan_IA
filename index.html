<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CBSL Fleet Manager</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.11.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.0"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Roboto', sans-serif; user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
        .glass-panel { background: rgba(17, 24, 39, 0.9); backdrop-filter: blur(12px); border-top: 1px solid rgba(255, 255, 255, 0.1); }
        .scanner-beam { position: absolute; width: 100%; height: 4px; background: #ef4444; box-shadow: 0 0 15px #ef4444; animation: beam-move 2s infinite ease-in-out; opacity: 0.7; }
        @keyframes beam-move { 0% { top: 10%; opacity: 0; } 50% { opacity: 1; } 100% { top: 90%; opacity: 0; } }
        .vehicle-card { transition: all 0.2s; border: 1px solid rgba(255,255,255,0.1); }
        .vehicle-card:active { transform: scale(0.95); background: rgba(220, 38, 38, 0.2); border-color: #ef4444; }
    </style>
</head>
<body class="bg-gray-900 text-white h-screen w-screen overflow-hidden flex flex-col">

    <!-- HEADER -->
    <header class="absolute top-0 w-full z-30 p-3 flex justify-between items-center bg-gradient-to-b from-black/90 to-transparent">
        <div class="flex items-center gap-2">
            <div class="bg-red-600 w-8 h-8 rounded flex items-center justify-center font-bold">F</div>
            <div>
                <h1 class="font-black text-sm tracking-wider">FLEET MANAGER</h1>
                <div class="flex items-center gap-1">
                    <div id="statusDot" class="w-2 h-2 rounded-full bg-yellow-500 animate-pulse"></div>
                    <span id="vehicleLabel" class="text-[10px] text-gray-400 font-mono font-bold uppercase">SEM VIATURA</span>
                </div>
            </div>
        </div>
        <button id="btnExitVehicle" class="hidden px-3 py-1 bg-gray-800 rounded text-xs border border-gray-600">Sair</button>
    </header>

    <!-- MAIN VIEWPORT -->
    <main class="flex-grow relative bg-black flex flex-col justify-center overflow-hidden">
        <video id="webcam" autoplay playsinline muted class="absolute inset-0 w-full h-full object-cover z-0"></video>
        
        <!-- Start Screen -->
        <div id="startScreen" class="absolute inset-0 z-50 bg-gray-900 flex flex-col items-center justify-center p-6 text-center">
            <i class="fas fa-truck-fire text-5xl text-red-500 mb-6 animate-pulse"></i>
            <h2 class="text-2xl font-bold mb-2">Conferência Inteligente</h2>
            <p class="text-gray-400 text-xs mb-8">Selecione a viatura e aponte a câmara para validar o material.</p>
            <button id="btnStart" class="bg-red-600 text-white font-bold py-4 px-12 rounded-lg shadow-lg disabled:opacity-50" disabled>INICIAR</button>
        </div>

        <!-- 1. SELETOR DE VIATURA (Overlay) -->
        <div id="fleetSelector" class="absolute inset-0 z-40 bg-gray-900/95 backdrop-blur hidden flex flex-col p-6 pt-20">
            <h2 class="text-xl font-bold mb-4 text-center">Selecionar Viatura</h2>
            <p class="text-xs text-center text-gray-500 mb-6">Escolha o veículo para carregar a lista específica.</p>
            
            <div class="grid grid-cols-2 gap-4 overflow-y-auto pb-20" id="fleetGrid">
                <!-- Gerado via JS -->
            </div>
            
            <div class="mt-4 text-center">
                <button class="text-xs text-gray-500 flex items-center justify-center gap-2 w-full p-2 border border-dashed border-gray-700 rounded">
                    <i class="fas fa-qrcode"></i> Ler QR Code (Simulado)
                </button>
            </div>
        </div>

        <!-- 2. CHECKLIST UI -->
        <div id="overlayChecklist" class="absolute inset-0 z-10 pointer-events-none hidden p-4 pt-24 flex flex-col justify-end pb-24">
            <!-- Scan Feedback -->
            <div class="absolute top-20 left-1/2 -translate-x-1/2 bg-black/50 px-4 py-1 rounded-full backdrop-blur border border-white/10 flex items-center gap-2">
                <div class="w-2 h-2 bg-red-500 rounded-full animate-ping"></div>
                <span id="scanFeedback" class="text-xs font-mono">A procurar material...</span>
            </div>

            <!-- Lista flutuante -->
            <div class="bg-black/80 backdrop-blur rounded-xl border border-gray-700 overflow-hidden pointer-events-auto max-h-[50vh] flex flex-col">
                <div class="p-3 bg-gray-800 border-b border-gray-700 flex justify-between items-center">
                    <h3 class="font-bold text-sm text-white"><i class="fas fa-list-check mr-2 text-blue-400"></i><span id="listTitle">Lista</span></h3>
                    <span id="progressText" class="text-xs font-mono bg-blue-900 px-2 py-0.5 rounded text-blue-200">0%</span>
                </div>
                <ul id="checklistItems" class="overflow-y-auto p-2 space-y-2 text-sm flex-grow">
                    <!-- Items -->
                </ul>
            </div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="z-30 glass-panel p-4 text-center">
        <p class="text-[10px] text-gray-500">CBSL AI v3.0 • Mode: Fleet Check</p>
    </footer>

    <script>
        // === BASE DE DADOS DA FROTA ===
        // Aqui define o que cada viatura deve ter
        const fleetDB = [
            {
                id: 'VUCI-01',
                name: 'VUCI 01',
                desc: 'Urbano - Mercedes',
                icon: 'fa-truck-medical', // Icon genérico de caminhão
                items: [
                    { id: 'helmet', label: 'Capacetes (EPI)', keywords: ['helmet', 'crash helmet', 'hard hat'] },
                    { id: 'hose', label: 'Mangueiras', keywords: ['hose', 'snake', 'tube'] }, // IA confunde mangueira com cobra as vezes
                    { id: 'nozzle', label: 'Agulhetas', keywords: ['drill', 'nozzle', 'tool'] }, // Agulheta parece berbequim para a IA
                    { id: 'axe', label: 'Machado Halligan', keywords: ['axe', 'hatchet', 'hammer'] }
                ]
            },
            {
                id: 'ABSC-04',
                name: 'ABSC 04',
                desc: 'Ambulância INEM',
                icon: 'fa-ambulance',
                items: [
                    { id: 'bag', label: 'Mala de Abordagem', keywords: ['backpack', 'bag', 'suitcase'] },
                    { id: 'oxygen', label: 'Garrafa O2', keywords: ['bottle', 'oxygen', 'extinguisher'] }, // Garrafas parecem extintores
                    { id: 'monitor', label: 'Monitor DAE', keywords: ['monitor', 'screen', 'laptop', 'radio'] },
                    { id: 'stretcher', label: 'Maca', keywords: ['stretcher', 'bed', 'hospital'] }
                ]
            },
            {
                id: 'VSAT-02',
                name: 'VSAT 02',
                desc: 'Desencarceramento',
                icon: 'fa-car-burst',
                items: [
                    { id: 'cone', label: 'Cones Sinalização', keywords: ['cone', 'traffic cone'] },
                    { id: 'cutter', label: 'Tesoura Hidráulica', keywords: ['chain saw', 'tool', 'cutter', 'scissors'] },
                    { id: 'generator', label: 'Gerador', keywords: ['generator', 'engine', 'machine'] }
                ]
            }
        ];

        // Estado da Aplicação
        const state = {
            model: null,
            isRunning: false,
            currentVehicle: null,
            checklistStatus: {} // Guarda o estado dos items
        };

        // Elementos DOM
        const els = {
            video: document.getElementById('webcam'),
            startScreen: document.getElementById('startScreen'),
            fleetSelector: document.getElementById('fleetSelector'),
            overlayChecklist: document.getElementById('overlayChecklist'),
            fleetGrid: document.getElementById('fleetGrid'),
            checklistItems: document.getElementById('checklistItems'),
            vehicleLabel: document.getElementById('vehicleLabel'),
            btnExit: document.getElementById('btnExitVehicle'),
            statusDot: document.getElementById('statusDot'),
            scanFeedback: document.getElementById('scanFeedback'),
            listTitle: document.getElementById('listTitle'),
            progressText: document.getElementById('progressText')
        };

        // 1. INICIALIZAÇÃO
        async function init() {
            try {
                // Carregar Mobilenet
                state.model = await mobilenet.load();
                
                document.getElementById('btnStart').disabled = false;
                els.statusDot.className = "w-2 h-2 rounded-full bg-green-500";
            } catch (e) {
                alert("Erro ao carregar IA");
            }
        }

        // 2. INICIAR CÂMARA E FLUXO
        document.getElementById('btnStart').addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                els.video.srcObject = stream;
                els.video.play();
                els.startScreen.classList.add('hidden');
                
                // Abre seletor de viatura
                openFleetSelector();
                state.isRunning = true;
                loop();
            } catch (e) { alert("Câmara bloqueada."); }
        });

        // 3. GESTÃO DE FROTA
        function openFleetSelector() {
            els.fleetSelector.classList.remove('hidden');
            els.overlayChecklist.classList.add('hidden');
            els.btnExit.classList.add('hidden');
            
            els.fleetGrid.innerHTML = '';
            
            fleetDB.forEach(vehicle => {
                const btn = document.createElement('div');
                btn.className = "vehicle-card bg-gray-800 p-4 rounded-xl cursor-pointer flex flex-col items-center gap-2";
                btn.onclick = () => selectVehicle(vehicle);
                
                btn.innerHTML = `
                    <div class="w-12 h-12 bg-gray-700 rounded-full flex items-center justify-center text-xl text-white">
                        <i class="fas ${vehicle.icon}"></i>
                    </div>
                    <div class="text-center">
                        <h3 class="font-bold text-sm text-white">${vehicle.name}</h3>
                        <p class="text-[10px] text-gray-400">${vehicle.desc}</p>
                    </div>
                `;
                els.fleetGrid.appendChild(btn);
            });
        }

        function selectVehicle(vehicle) {
            state.currentVehicle = vehicle;
            
            // Inicializar estado da checklist (tudo a false)
            state.checklistStatus = {};
            vehicle.items.forEach(i => state.checklistStatus[i.id] = false);

            // Atualizar UI
            els.fleetSelector.classList.add('hidden');
            els.overlayChecklist.classList.remove('hidden');
            els.vehicleLabel.innerText = vehicle.name;
            els.listTitle.innerText = `Lista ${vehicle.id}`;
            els.btnExit.classList.remove('hidden');

            renderChecklist();
        }

        els.btnExit.addEventListener('click', () => {
            state.currentVehicle = null;
            els.vehicleLabel.innerText = "SEM VIATURA";
            openFleetSelector();
        });

        // 4. LOOP DE IA
        async function loop() {
            if (!state.isRunning) return;

            if (state.currentVehicle) {
                const predictions = await state.model.classify(els.video);
                if (predictions.length > 0) {
                    checkItems(predictions);
                }
            }

            setTimeout(() => requestAnimationFrame(loop), 500); // 2 checks por segundo
        }

        function checkItems(predictions) {
            if (!state.currentVehicle) return;

            const detectedWords = predictions.map(p => p.className.toLowerCase());
            let updated = false;

            // Debug visual do que a IA está a ver
            els.scanFeedback.innerText = "A ver: " + detectedWords[0].split(',')[0];

            state.currentVehicle.items.forEach(item => {
                // Se ainda não foi marcado
                if (!state.checklistStatus[item.id]) {
                    // Verifica se alguma palavra chave foi detetada
                    const match = item.keywords.some(keyword => 
                        detectedWords.some(detected => detected.includes(keyword))
                    );

                    if (match) {
                        state.checklistStatus[item.id] = true;
                        updated = true;
                        speak("Confirmado " + item.label);
                    }
                }
            });

            if (updated) renderChecklist();
        }

        // 5. RENDERIZAR LISTA
        function renderChecklist() {
            els.checklistItems.innerHTML = '';
            let total = state.currentVehicle.items.length;
            let done = 0;

            state.currentVehicle.items.forEach(item => {
                const isDone = state.checklistStatus[item.id];
                if (isDone) done++;

                const li = document.createElement('li');
                li.className = `flex justify-between items-center p-3 rounded border transition-all duration-300 ${isDone ? 'bg-green-900/40 border-green-500' : 'bg-gray-800 border-gray-700'}`;
                
                li.innerHTML = `
                    <span class="${isDone ? 'text-white font-bold' : 'text-gray-400'}">${item.label}</span>
                    <div class="w-6 h-6 rounded-full border flex items-center justify-center ${isDone ? 'bg-green-500 border-green-500 text-black' : 'border-gray-600'}">
                        ${isDone ? '<i class="fas fa-check text-xs"></i>' : ''}
                    </div>
                `;
                els.checklistItems.appendChild(li);
            });

            // Barra de Progresso
            const percent = Math.round((done / total) * 100);
            els.progressText.innerText = percent + "%";
            
            if (percent === 100) {
                els.scanFeedback.innerText = "VIATURA PRONTA!";
                els.scanFeedback.parentElement.classList.replace('bg-black/50', 'bg-green-600');
            }
        }

        // Síntese de Voz
        function speak(text) {
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'pt-PT';
            window.speechSynthesis.speak(u);
        }

        init();
    </script>
</body>
</html>
